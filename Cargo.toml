[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ajsb85/sprdflash-rs"
authors = ["ajsb85"]

[workspace.dependencies]
sprdflash-core = { path = "crates/sprdflash-core", version = "0.8.0" }
sprdflash-transport = { path = "crates/sprdflash-transport", version = "0.8.0" }
sprdflash-flash = { path = "crates/sprdflash-flash", version = "0.8.0" }
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Release profile tuned for a manufacturing binary: fast, small, and with
# overflow checks kept ON (correctness on the line beats a few cycles).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
